apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: kustomize
    mode: kubernetes
  signoz:
    spec:
      image: signoz/signoz:v0.140.0
      version: v0.140.0
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.9
      version: v0.144.9
  telemetrystore:
    spec:
      image: clickhouse/clickhouse-server:25.12.5
      version: 25.12.5
